<!doctype html>

  <style>
    :root { color-scheme:light; --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --accent:#eb6c36; --link:#2e5aa8; }

    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Geist","PingFang SC","Noto Sans CJK SC",sans-serif; }
    main { max-width:1360px; margin:auto; padding:24px 20px 44px; }
    .sheet { background:#fff; border:1px solid rgba(45,49,66,.12); border-radius:8px; overflow:hidden; }
    svg { display:block; width:100%; height:auto; }
    .note { max-width:960px; margin:20px 4px 0; font-size:14px; line-height:1.7; color:var(--muted); }
    a { color:var(--link); }
    @media (max-width:720px) { main { padding:12px 8px 28px; } .sheet { overflow-x:auto; } svg { min-width:960px; } }
  </style>
</head>
