<!DOCTYPE html>

  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #2d3142; font-family: 'Geist', 'PingFang SC', 'Hiragino Sans GB', sans-serif; }

    svg { display: block; width: 100%; min-width: 1120px; }

</head>
<body>
<main>
  <p class="eyebrow">Product flow / Draft for review</p>

      <text x="684" y="676" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">证据回流</text>
      <rect x="936" y="664" width="24" height="16" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36"/>
      <text x="972" y="676" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">核心价值点</text>

  <p class="note">历史探索图：2026-09-19 后当前首片为持续岗位发现与原站投递入口（#9），外部课程章节导航顺延为 #8；图中独立复测为后续待设计能力。学习结果不会自动替用户填写“符合资格”“已掌握”或“已投递”。</p>
