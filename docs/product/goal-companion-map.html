<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>目标执行伴随系统 · 总览</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; color: #2d3142; font-family: 'Geist', 'PingFang SC', system-ui, sans-serif; }
    main { max-width: 1420px; margin: 0 auto; padding: 36px 28px 48px; }
    .eyebrow { margin: 0 0 8px; color: #4f5d75; font: 500 11px 'Geist Mono', monospace; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0 0 10px; font: 400 38px/1.16 'Instrument Serif', 'Songti SC', serif; }
    .intro { max-width: 900px; margin: 0 0 24px; color: #4f5d75; font-size: 15px; line-height: 1.65; }
    .scroll { overflow-x: auto; }
    svg { display: block; width: 100%; min-width: 1120px; }
    .note { margin: 12px 0 0; color: #4f5d75; font-size: 13px; line-height: 1.7; }
    @media (max-width: 680px) { main { padding: 24px 16px; } h1 { font-size: 30px; } }
  </style>
</head>
<body>
<main>
  <p class="eyebrow">Career Workbench / Product map / Draft</p>
  <h1>真实目标如何变成每天可执行的行动</h1>
  <p class="intro">五步循环处理目标与实际结果；三种界面读取同一份事实。只有未开始的弹性任务可自动排序或挪动时段，其他计划变更先供用户确认。</p>
  <div class="scroll">
    <svg viewBox="0 0 1320 620" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="goal-companion-map-title goal-companion-map-desc">
      <title id="goal-companion-map-title">目标执行伴随系统总览</title>
      <desc id="goal-companion-map-desc">用户设目标，系统形成计划与今日行动，用户执行并记录结果，系统复盘后提出下一版计划。事实存储同时供右上角小窗、完整工作台与游戏世界读取。</desc>
      <defs>
        <marker id="goal-companion-map-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="goal-companion-map-accent-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="1320" height="620" fill="#f5f5f5"/>

      <!-- Main cycle; connectors precede boxes. -->
      <path d="M264 152 H304" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#goal-companion-map-arrow)"/>
      <path d="M512 152 H552" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#goal-companion-map-arrow)"/>
      <path d="M760 152 H800" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#goal-companion-map-arrow)"/>
      <path d="M1008 152 H1048" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#goal-companion-map-arrow)"/>
      <path d="M1152 108 V64 Q1152 56 1144 56 H416 Q408 56 408 64 V108" fill="none" stroke="#eb6c36" stroke-width="1.5" marker-end="url(#goal-companion-map-accent-arrow)"/>
      <path d="M904 196 V328" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#goal-companion-map-arrow)"/>
      <path d="M560 420 V444 Q560 452 552 452 H172 Q164 452 164 460 V500" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#goal-companion-map-arrow)"/>
      <path d="M660 420 V500" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#goal-companion-map-arrow)"/>
      <path d="M760 420 V444 Q760 452 768 452 H1148 Q1156 452 1156 460 V500" fill="none" stroke="#4f5d75" stroke-width="1.5" marker-end="url(#goal-companion-map-arrow)"/>

      <text x="32" y="92" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" letter-spacing="1">01 / EXECUTION LOOP</text>
      <text x="768" y="48" fill="#af4f28" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">确认后形成新版本；弹性任务可自动微调</text>
      <rect x="40" y="108" width="224" height="88" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <rect x="304" y="108" width="208" height="88" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <rect x="552" y="108" width="208" height="88" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <rect x="800" y="108" width="208" height="88" rx="6" fill="#ffffff" stroke="#2d3142"/>
      <rect x="1048" y="108" width="224" height="88" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36"/>
      <g fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">
        <text x="56" y="128">01 · GOAL</text><text x="320" y="128">02 · PLAN v1…n</text><text x="568" y="128">03 · TODAY</text><text x="816" y="128">04 · RESULT</text><text x="1064" y="128">05 · REVIEW</text>
      </g>
      <g fill="#2d3142" font-size="18" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">
        <text x="56" y="160">设定真实目标</text><text x="320" y="160">确认阶段计划</text><text x="568" y="160">选择今日行动</text><text x="816" y="160">执行并记录</text><text x="1064" y="160">提出调整</text>
      </g>
      <g fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">
        <text x="56" y="180">期限、起点、可用时间</text><text x="320" y="180">依据、未知项、版本</text><text x="568" y="180">来源与完成标准</text><text x="816" y="180">成果和线索分开</text><text x="1064" y="180">差异、理由、变更清单</text>
      </g>

      <text x="416" y="308" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace" letter-spacing="1">02 / ONE FACTUAL STATE</text>
      <rect x="416" y="328" width="488" height="92" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1.5"/>
      <text x="436" y="360" fill="#2d3142" font-size="18" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">目标 · 计划版本 · 任务 · 结果</text>
      <text x="436" y="384" fill="#4f5d75" font-size="13" font-family="'Geist', 'PingFang SC', sans-serif">本机优先；真实证据与游戏反馈分别记录</text>
      <text x="436" y="404" fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">工作台操作与明确连接的工具事件可输入线索</text>

      <rect x="40" y="500" width="248" height="72" rx="6" fill="#ffffff" stroke="#4f5d75"/>
      <rect x="536" y="500" width="248" height="72" rx="6" fill="#ffffff" stroke="#4f5d75"/>
      <rect x="1032" y="500" width="248" height="72" rx="6" fill="#ffffff" stroke="#4f5d75"/>
      <g fill="#2d3142" font-size="17" font-weight="600" font-family="'Geist', 'PingFang SC', sans-serif">
        <text x="56" y="532">右上角伴随小窗</text><text x="552" y="532">完整工作台</text><text x="1048" y="532">角色与游戏场景</text>
      </g>
      <g fill="#4f5d75" font-size="12" font-family="'Geist', 'PingFang SC', sans-serif">
        <text x="56" y="552">低干扰，逐级展开</text><text x="552" y="552">计划、任务、复盘操作</text><text x="1048" y="552">反映行动，不冒充结果</text>
      </g>
      <line x1="40" y1="596" x2="1280" y2="596" stroke="rgba(45,49,66,.18)"/>
      <text x="40" y="612" fill="#4f5d75" font-size="11" font-family="'Geist Mono', monospace">图例：实线＝计划与事实流；橙色＝计划变更；本图为设计提案，非已上线功能</text>
    </svg>
  </div>
  <p class="note">秋招与 CET6 复用上方的循环；岗位回执和考试结果分别按领域证据核验。2D/2.5D 与 3D 的呈现路线由同一场景的实际运行对照决定。</p>
</main>
</body>
</html>
