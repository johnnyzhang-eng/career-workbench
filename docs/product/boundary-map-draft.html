<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Career Workbench · 产品边界草图</title>
  <style>
    :root { color-scheme: light; --paper:#f5f5f5; --ink:#2d3142; --muted:#4f5d75; --accent:#eb6c36; --link:#2e5aa8; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--paper); color:var(--ink); font-family:"Geist","PingFang SC","Noto Sans CJK SC",sans-serif; }
    main { max-width:1360px; margin:auto; padding:28px 20px 52px; }
    .sheet { background:#fff; border:1px solid #e4e6e9; border-radius:18px; overflow:hidden; box-shadow:0 12px 44px rgba(45,49,66,.05); }
    svg { display:block; width:100%; height:auto; }
    .notes { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; margin-top:20px; }
    article { padding:18px 20px; border-top:2px solid #dfe3e8; background:#fff; border-radius:12px; }
    article:nth-child(1) { border-color:var(--accent); }
    h2 { font-size:14px; margin:0 0 8px; letter-spacing:.02em; }
    p { font-size:13px; line-height:1.7; margin:0; color:var(--muted); }
    .source { margin:20px 2px 0; font-size:12px; line-height:1.7; color:var(--muted); }
    a { color:var(--link); }
    @media (max-width:720px) { main { padding:12px 8px 28px; } .notes { grid-template-columns:1fr; } .sheet { overflow-x:auto; } svg { min-width:920px; } }
  </style>
</head>
<body>
<main>
  <div class="sheet">
    <svg viewBox="0 0 1280 720" role="img" aria-labelledby="diagram-title diagram-desc" xmlns="http://www.w3.org/2000/svg">
      <title id="diagram-title">Career Workbench 产品边界：找到一个或多个岗位方向，以练习证据逐步靠近</title>
      <desc id="diagram-desc">学生的私有资料进入工作台。岗位可由用户粘贴链接或正文，也可从经核验的公开来源导入；提取结果先由人确认。用户自带模型可在授权后提出有来源的能力缺口与练习建议，但独立练习和复测才是能力证据。合适的岗位可由本人直接到外部招聘平台投递，回执由工作台记录。练习并非投递前置门槛，公开仓不保存个人资料。</desc>
      <defs>
        <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#4f5d75"/></marker>
        <marker id="arrow-soft" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8 Z" fill="#9aa3b2"/></marker>
      </defs>

      <rect width="1280" height="720" fill="#ffffff"/>
      <text x="48" y="52" fill="#eb6c36" font-family="'Geist Mono',monospace" font-size="12" letter-spacing="2">DRAFT 01 · PRODUCT BOUNDARY</text>
      <text x="48" y="104" fill="#2d3142" font-family="'Instrument Serif','Songti SC','Noto Serif CJK SC',serif" font-size="32">找到目标，用练习证据靠近岗位</text>
      <text x="48" y="140" fill="#4f5d75" font-family="'Geist','PingFang SC','Noto Sans CJK SC',sans-serif" font-size="16">可选择一个或多个方向；投递和补能力并行，路线随证据调整。</text>

      <rect x="288" y="196" width="744" height="388" rx="12" fill="rgba(45,49,66,.02)" stroke="rgba(45,49,66,.18)" stroke-width="1" stroke-dasharray="6 6"/>
      <rect x="308" y="188" width="120" height="20" fill="#ffffff"/>
      <text x="316" y="204" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12" letter-spacing="1">工作台负责</text>
      <rect x="48" y="196" width="208" height="36" rx="8" fill="#f2f4f7"/>
      <text x="64" y="220" fill="#4f5d75" font-family="'Geist','PingFang SC',sans-serif" font-size="12">用户掌控 · 私有资料</text>
      <rect x="1048" y="196" width="176" height="36" rx="8" fill="#f2f4f7"/>
      <text x="1064" y="220" fill="#4f5d75" font-family="'Geist','PingFang SC',sans-serif" font-size="12">外部平台与内容</text>

      <path d="M844 384 V440" fill="none" stroke="#4f5d75" stroke-width="2" marker-end="url(#arrow)"/>
      <path d="M936 492 H1048" fill="none" stroke="#2e5aa8" stroke-width="2" marker-end="url(#arrow)"/>
      <rect x="968" y="468" width="80" height="16" rx="4" fill="#ffffff"/>
      <text x="1008" y="480" text-anchor="middle" fill="#2e5aa8" font-family="'Geist','PingFang SC',sans-serif" font-size="12">按需跳转</text>

      <rect x="840" y="568" width="152" height="16" rx="4" fill="#ffffff"/>
      <text x="916" y="580" text-anchor="middle" fill="#4f5d75" font-family="'Geist','PingFang SC',sans-serif" font-size="12">本人带回真实回执</text>

        <text x="64" y="308" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">U0 · 私有</text>
        <text x="64" y="336" fill="#2d3142" font-family="'Geist','PingFang SC',sans-serif" font-size="16" font-weight="600">学生本人</text>
        <text x="64" y="364" fill="#4f5d75" font-family="'Geist','PingFang SC',sans-serif" font-size="12">简历 · 条件 · 经历证据</text>
      </g>

      </g>
      <g>

        <text x="552" y="336" fill="#2d3142" font-family="'Geist','PingFang SC',sans-serif" font-size="16" font-weight="600">真实岗位卡</text>
        <text x="552" y="364" fill="#4f5d75" font-family="'Geist','PingFang SC',sans-serif" font-size="12">导入/发现 · 原站链接</text>
      </g>
      <g>
        <rect x="752" y="280" width="184" height="104" rx="12" fill="#fff8f4" stroke="#eb6c36" stroke-width="1.5"/>

        <text x="768" y="468" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">P4 · 待验证</text>

      </g>
      <g>
        <rect x="536" y="440" width="184" height="104" rx="12" fill="#ffffff" stroke="#b7c1d0" stroke-width="1.5"/>
        <text x="552" y="468" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">P5 · 记录底座已有</text>
        <text x="552" y="496" fill="#2d3142" font-family="'Geist','PingFang SC',sans-serif" font-size="16" font-weight="600">投递与反馈</text>
        <text x="552" y="524" fill="#4f5d75" font-family="'Geist','PingFang SC',sans-serif" font-size="12">回执 · 状态 · 面试追问</text>
      </g>
      <g>
        <rect x="1048" y="280" width="176" height="104" rx="12" fill="#f2f4f7" stroke="#cfd5dd" stroke-width="1.5"/>
        <text x="1064" y="308" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">E0 · 产品外</text>
        <text x="1064" y="336" fill="#2d3142" font-family="'Geist','PingFang SC',sans-serif" font-size="16" font-weight="600">招聘网站</text>
        <text x="1064" y="364" fill="#4f5d75" font-family="'Geist','PingFang SC',sans-serif" font-size="12">提交动作由本人完成</text>
      </g>
      <g>
        <rect x="1048" y="440" width="176" height="104" rx="12" fill="#f2f4f7" stroke="#cfd5dd" stroke-width="1.5"/>
        <text x="1064" y="468" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">E1 · 聚合外链</text>
        <text x="1064" y="496" fill="#2d3142" font-family="'Geist','PingFang SC',sans-serif" font-size="16" font-weight="600">现成学习资源</text>

      </g>

      <line x1="48" y1="632" x2="1232" y2="632" stroke="#e4e6e9"/>
      <text x="48" y="668" fill="#2d3142" font-family="'Geist','PingFang SC',sans-serif" font-size="13" font-weight="600">本期不做</text>
      <text x="144" y="668" fill="#4f5d75" font-family="'Geist','PingFang SC',sans-serif" font-size="13">自动海投 / 绕过平台规则 / 保证录用 / 将个人资料放进公开仓库</text>
      <text x="48" y="696" fill="#4f5d75" font-family="'Geist','PingFang SC',sans-serif" font-size="12">设计草案 ≠ 已上线。当前仅有本地命令行的手动录入与状态记录底座；网页交互、找岗、缺口评估、练习与资源聚合尚待开发。</text>
    </svg>
  </div>
  <section class="notes" aria-label="图的阅读方式">
    <article><h2>产品交付物</h2><p>学生能选定一个或多个目标方向，看到各方向的真实岗位入口、共通与专属缺口，并用练习和投递反馈观察自己是否在靠近它们。</p></article>
    <article><h2>关键边界</h2><p>工作台组织目标、岗位、外部章节和学习记录；模型经授权提出建议，自报学完仍待验证。课程和题库由外部提供，首片不自建教学与判题，投递仍由本人完成。</p></article>
    <article><h2>下一轮要验证</h2><p>从两份虚构岗位的共通要求进入合适的外部章节，解释推荐、切换资源并返回记录进度；后续再验证真实岗位与能力变化。</p></article>
  </section>
  <p class="source">方法参考：<a href="https://github.com/1024XEngineer/Windup">Windup</a> 的产品策划方法——先确认用户、完整交付和人工确认，再讨论备选方案、非目标与可验收的窄切片。这里只借方法，不复制其功能与行业结论。</p>
</main>
</body>
</html>
