<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>对话观察与交接状态</title>
<style>:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75;--accent:#eb6c36}body{margin:0;background:var(--paper);color:var(--ink);font-family:Geist,system-ui,sans-serif}main{max-width:960px;margin:32px auto;padding:0 24px}h1{font-family:'Instrument Serif',serif;font-size:28px;font-weight:400}p{color:var(--muted);line-height:1.6}svg{width:100%;height:auto}svg text{font-family:Geist,system-ui,sans-serif}.node{fill:white;stroke:var(--ink)}.future{fill:#f5f5f5;stroke:#7a8399;stroke-dasharray:4 4}.edge{fill:none;stroke:#4f5d75;marker-end:url(#watch-arrow)}.label{font-size:12px;fill:#4f5d75}.name{font-size:16px;fill:#2d3142;font-weight:600}</style></head>
<body><main><h1>对话变长以后，先交接，再换入口</h1><p>观察层已实现；语义复核需单独启用。自动建聊与归档仍是后续能力，不会由活动事件触发。</p>
<svg viewBox="0 0 960 600" role="img" aria-labelledby="watch-title watch-desc"><title id="watch-title">观察、待核对与阶段交接</title><desc id="watch-desc">正在进行的对话由本地检查器观察。有压力时等待回合结束，然后核对短交接与阶段证据。通过验收后准备交接，用户请求后才进入新对话或归档。最后的自动步骤尚未实现。</desc>
<defs><marker id="watch-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker><marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker><marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker></defs>
<path class="edge" stroke-dasharray="4 4" d="M280 500 H400"/>
<path class="edge" d="M280 140 H400"/><path class="edge" d="M520 180 V280"/><path class="edge" d="M400 320 H280"/><path class="edge" d="M160 360 V460"/>
<rect x="312" y="112" width="56" height="20" fill="#f5f5f5"/><text class="label" x="340" y="128" text-anchor="middle">压力提示</text>
<rect x="528" y="216" width="104" height="20" fill="#f5f5f5"/><text class="label" x="532" y="232">当前回合已结束</text>
<rect x="304" y="292" width="72" height="20" fill="#f5f5f5"/><text class="label" x="340" y="308" text-anchor="middle">依据已核对</text>
<rect x="168" y="396" width="144" height="20" fill="#f5f5f5"/><text class="label" x="172" y="412">本人请求；接续后验收</text>
<rect class="node" x="40" y="100" width="240" height="80" rx="8"/><text class="name" x="160" y="132" text-anchor="middle">01 正常推进</text><text class="label" x="160" y="156" text-anchor="middle">读新增元数据；无变化安静</text>
<rect class="node" x="400" y="100" width="240" height="80" rx="8"/><text class="name" x="520" y="132" text-anchor="middle">02 等待安全边界</text><text class="label" x="520" y="156" text-anchor="middle">运行中延后；压缩作废旧指标</text>
<rect x="400" y="280" width="240" height="80" rx="8" fill="#fce9e0" stroke="#eb6c36"/><text class="name" x="520" y="312" text-anchor="middle">03 核对阶段证据</text><text class="label" x="520" y="336" text-anchor="middle">回合结束 ≠ 任务完成</text>
<rect class="node" x="40" y="280" width="240" height="80" rx="8"/><text class="name" x="160" y="312" text-anchor="middle">04 准备短交接</text><text class="label" x="160" y="336" text-anchor="middle">保留历史、未知与唯一下一步</text>

<rect class="future" x="40" y="460" width="240" height="64" rx="8"/><text class="name" x="160" y="488" text-anchor="middle">05 新入口或阶段收尾</text><text class="label" x="160" y="512" text-anchor="middle">当前按明确请求操作</text>
<rect class="future" x="400" y="460" width="240" height="64" rx="8"/><text class="name" x="520" y="488" text-anchor="middle">06 自动执行（未实现）</text><text class="label" x="520" y="512" text-anchor="middle">建聊、改入口、归档需另验收</text>
<text class="label" x="688" y="300">来源异常 → 未知</text><text class="label" x="688" y="324">证据不足 → 待核对</text><text class="label" x="688" y="348">不根据沉默判失败</text>
<line x1="40" y1="552" x2="920" y2="552" stroke="#bfc0c0"/><text class="label" x="40" y="576">实线：观察与复核流程</text><text class="label" x="360" y="576">虚线：尚未实现的自动步骤</text>
</svg><p>试验门槛是最近一次输入比率 0.8，可调整；它不是精确实时占用。当前不根据这个值自动换对话。</p></main></body></html>
