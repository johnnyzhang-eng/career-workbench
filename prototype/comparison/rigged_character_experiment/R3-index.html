<h1>R2 → R3：角色接点和动作</h1>
<p>以下小窗画面均按 <strong>360 CSS 像素</strong>显示，和预期角落窗同宽；PNG/视频来自 Godot 4.7 实窗的 Retina 2× 像素采集。原 A 房间、镜头、光照、任务 UI 不变。<a href="R3-README.md">实验说明与复现</a> · <a href="R3/manifest.json">采集数据</a></p>
<p class="warning">R3 静态髋部接点改善，但手部动作在原 A 小窗里仍弱；起始已经坐着，不能称作完整站坐动画。图中的任务是虚构演示。</p>
