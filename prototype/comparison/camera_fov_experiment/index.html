<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原版 A 相机视野单因素对照</title>
<style>
body{margin:0;background:#f5f1e8;color:#293b38;font:16px/1.55 system-ui,sans-serif}
header{padding:24px clamp(20px,4vw,56px);border-bottom:1px solid #ccc7bb}
h1{margin:0 0 6px;font-size:26px}p{margin:0 0 14px}
nav{display:flex;gap:16px;flex-wrap:wrap}label{font-weight:600}select{padding:8px;border:1px solid #a6aba2;border-radius:7px;background:white;font:inherit}
main{padding:24px clamp(20px,4vw,56px)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
figure{margin:0}figcaption{font-size:19px;font-weight:700;margin-bottom:8px}img{width:100%;height:auto;display:block;background:#e8e8e2;border:1px solid #bfc4b9;box-sizing:border-box}
.note{margin-top:20px;color:#52635d}a{color:#275e64}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
<header>
<h1>原版 A：相机视野对照</h1>
<p>C0 为透视 FOV 45°；C1 只改为 41°。相机位置、光照、几何、UI 均不变。实际 Godot 运行截图，未评定优胜。</p>
<nav><label>尺寸 <select id="size"><option>360x320</option><option>1280x720</option></select></label><label>时段 <select id="phase"><option value="day">白天</option><option value="evening">夜间</option></select></label></nav>
</header>
<main>
<div class="grid">
<figure><figcaption>C0 · 原版 45°</figcaption><img id="c0" alt="C0 原版运行截图"></figure>
<figure><figcaption>C1 · 视野 41°</figcaption><img id="c1" alt="C1 相机视野实验运行截图"></figure>
</div>
<p class="note">小窗请按逻辑 360×320 原大审图。参数和边界见 <a href="README.md">README</a> 与 <a href="manifest.json">manifest</a>。全窗左上角是实时系统时钟。</p>
</main>
<script>
const size=document.getElementById('size'),phase=document.getElementById('phase');
function update(){for(const variant of ['C0','C1'])document.getElementById(variant.toLowerCase()).src=`${variant}/baseline-${size.value}-${phase.value}-idle.png`}
size.addEventListener('change',update);phase.addEventListener('change',update);update();
</script>
</html>
