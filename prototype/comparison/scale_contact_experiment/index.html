<body>
  <h1>M3 · 任务镜头、桌椅高度与角色接触</h1>
  <p>原大 360×320 小窗，2× Retina 实机输出，保留清单与按钮。R4 固定近镜头／放大人物；M3 待开始看全景、明确开始后切桌面，人物与桌椅高度同步校正。<a href="README.md">来源与局限</a> · <a href="manifest.json">原始记录</a></p>
  <div class="grid">
    <figure><img src="captures/R4-360x320-day-idle.png" alt="R4 固定近镜头待开始，站立角色被裁切"><figcaption><strong>R4 待开始</strong><br>固定桌面近镜头让站立角色裁切；不能只评估进行中截图。</figcaption></figure>
    <figure><img src="captures/M3-360x320-day-idle.png" alt="M3 待开始，房间全景与站立角色"><figcaption><strong>M3 待开始</strong><br>明确任务尚未开始，镜头展示全景。</figcaption></figure>
    <figure><img src="captures/R4-360x320-day-started.png" alt="R4 放大角色在桌面近景"><figcaption><strong>R4 已开始</strong><br>放大 1.35 倍人物，动作占屏更多，但桌椅高度未按人体统一。</figcaption></figure>
    <figure><img src="captures/M3-360x320-day-started.png" alt="M3 原比例人物在较低桌椅前"><figcaption><strong>M3 已开始</strong><br>镜头随明确开始而切近桌面；桌椅高度更合理，人物仍小、椅背有遮挡。</figcaption></figure>
  </div>
  <figure><video controls preload="metadata" poster="captures/M3-360x320-day-idle.png" aria-label="点击开始任务后的镜头过渡和人物跳变"><source src="captures/m3-camera-transition.mp4" type="video/mp4"></video><figcaption><strong>M3 动态核验</strong><br>明确点击开始后相机用 0.65 秒缓动拉近；站立占位角色瞬时换为静态坐姿，仍需要动作和造型统一。<a href="camera_film.json">短片校验记录</a></figcaption></figure>
  <p>更多证据：<a href="captures/R4-1280x720-day-started.png">R4 展开白天</a> · <a href="captures/M3-1280x720-day-started.png">M3 展开白天</a> · <a href="captures/R4-360x320-evening-started.png">R4 小窗夜晚</a> · <a href="captures/M3-360x320-evening-started.png">M3 小窗夜晚</a>。</p>
  <p>图片仅含虚构任务与许可明确的实验素材。相机、坐姿、灯光变化不修改任务事实或完成状态。</p>
