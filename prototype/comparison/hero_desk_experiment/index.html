<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>原版 A 单桌面网格对照</title>
<style>
body{margin:0;background:#f5f1e8;color:#293b38;font:16px/1.55 system-ui,sans-serif}
header{padding:24px clamp(20px,4vw,56px);border-bottom:1px solid #ccc7bb}
h1{margin:0 0 6px;font-size:26px}p{margin:0 0 14px}
nav{display:flex;gap:16px;flex-wrap:wrap}label{font-weight:600}select{padding:8px;border:1px solid #a6aba2;border-radius:7px;background:white;font:inherit}
main{padding:24px clamp(20px,4vw,56px)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
figure{margin:0}figcaption{font-size:19px;font-weight:700;margin-bottom:8px}img{max-width:100%;height:auto;display:block;background:#e8e8e2;border:1px solid #bfc4b9;box-sizing:border-box}
.small img{width:360px}.large img{width:100%}.note{margin-top:20px;color:#52635d}a{color:#275e64}
@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
<header>
<h1>原版 A：单桌面网格对照</h1>
<p>D0 保留方盒桌面；D1 只换一件有倒角/法线/三材质的自制 Blender 桌面。镜头、光照、腿、角色和 UI 不变。实际运行截图，未评定优胜。</p>
<nav><label>尺寸 <select id="size"><option>360x320</option><option>1280x720</option></select></label><label>时段 <select id="phase"><option value="day">白天</option><option value="evening">夜间</option></select></label></nav>
</header>
<main>
<div class="grid small" id="grid">
<figure><figcaption>D0 · 原版桌面</figcaption><a id="d0link"><img id="d0" alt="D0 原版运行截图"></a></figure>
<figure><figcaption>D1 · Blender 网格桌面</figcaption><a id="d1link"><img id="d1" alt="D1 单桌面实验运行截图"></a></figure>
</div>
<p class="note">小窗以 360 CSS 像素展示，适合看原大辨识；点击图可打开原始 PNG。参数、可编辑源和边界见 <a href="README.md">README</a> 与 <a href="manifest.json">manifest</a>。</p>
</main>
<script>
const size=document.getElementById('size'),phase=document.getElementById('phase'),grid=document.getElementById('grid');
function update(){grid.className=`grid ${size.value==='360x320'?'small':'large'}`;for(const variant of ['D0','D1']){const path=`${variant}/baseline-${size.value}-${phase.value}-idle.png`;document.getElementById(variant.toLowerCase()).src=path;document.getElementById(variant.toLowerCase()+'link').href=path}}
size.addEventListener('change',update);phase.addEventListener('change',update);update();
</script>
</html>
