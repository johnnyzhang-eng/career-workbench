<!doctype html><meta charset="utf-8"><title>本地透明与遮挡控制样本</title><style>body{margin:0;background:repeating-linear-gradient(45deg,#346a58 0 36px,#a7c8b7 36px 72px);font:24px system-ui;color:#fff;height:100vh}main{padding:60px;background:#1f403bcc;width:60%;pointer-events:none}#count{font-size:80px}</style><main><h1>本地窗口控制样本</h1><p>点击页面任意空白处计数，无网络请求、无真实数据。</p><div id="count">0</div><p id="point">等待点击</p></main><script>let n=0;document.addEventListener('click',e=>{document.querySelector('#count').textContent=++n;document.querySelector('#point').textContent=`页面收到点击：${e.clientX}, ${e.clientY}`})</script>
